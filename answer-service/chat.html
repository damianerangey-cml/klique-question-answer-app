<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
  /* One column: a header, the conversation, and the question box pinned to the bottom. */
  :root {
    --bg: #F7F8F7; --paper: #FFFFFF; --ink: #2B2F2D; --muted: #63696A; --line: #DFE3E1;
    --accent: #42D98E; --accent-ink: #07AA6B; --bad: #C7443C;
    --font: "Be Vietnam Pro", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151716; --paper: #1D201F; --ink: #E3E6E4; --muted: #A2A8A6; --line: #313533;
            --accent: #6DF2B0; --accent-ink: #6DF2B0; --bad: #FF7A70; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); display: flex; flex-direction: column; }
  header { padding: 16px max(16px, 5vw); border-bottom: 1px solid var(--line); background: var(--paper); }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  main { flex: 1; overflow-y: auto; padding: 20px max(16px, 5vw); }
  .thread { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .me { align-self: flex-end; background: var(--paper); border: 1px solid var(--line); }
  .bot { align-self: flex-start; background: var(--paper); border: 1px solid var(--line); border-left: 3px solid var(--accent); }
  .bot.error { border-left-color: var(--bad); }
  .sources { margin-top: 8px; font-size: 12.5px; color: var(--muted); white-space: normal; }
  .sources b { font-weight: 500; }
  .waiting { color: var(--muted); }
  .start { max-width: 760px; margin: 0 auto; color: var(--muted); }
  .start p { margin: 0 0 10px; }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; }
  .suggest button { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--paper); border: 1px solid var(--line);
                    border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  .suggest button:hover { border-color: var(--accent-ink); }
  form { padding: 12px max(16px, 5vw) 16px; border-top: 1px solid var(--line); background: var(--paper); }
  .row { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
             border-radius: 6px; padding: 10px 12px; resize: none; height: 46px; }
  button.send { font: inherit; font-weight: 600; color: #0B2E1E; background: var(--accent); border: 0; border-radius: 6px; padding: 0 18px; cursor: pointer; }
  button.send:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>Ask support</h1>
  <p>Answers come from the product support articles. Questions are checked before they are answered.</p>
</header>
<main id="main">
  <div class="start" id="start">
    <p>Try one of these, or type your own question below.</p>
    <div class="suggest">
      <button type="button">How do I reset my password?</button>
      <button type="button">My router shows as offline. What should I check?</button>
      <button type="button">How do I set up a guest network?</button>
      <button type="button">When is my bill due?</button>
    </div>
  </div>
  <div class="thread" id="thread" aria-live="polite"></div>
</main>
<form id="form">
  <div class="row">
    <label for="q" hidden>Your question</label>
    <textarea id="q" placeholder="Ask a question" required></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </div>
</form>
<script>
  const thread = document.getElementById('thread');
  const main = document.getElementById('main');
  const q = document.getElementById('q');
  const send = document.getElementById('send');

  function add(cls, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;
    thread.appendChild(el);
    main.scrollTop = main.scrollHeight;
    return el;
  }

  async function ask(question) {
    document.getElementById('start').hidden = true;
    add('me', question);
    const reply = add('bot waiting', 'Checking the question and looking up the articles…');
    send.disabled = true;
    try {
      // relative, so it works behind any route prefix, with or without a trailing slash
      const here = location.pathname.endsWith('/') ? '' : location.pathname.split('/').pop() + '/';
      const r = await fetch(here + 'ask', {method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'include',
                                    body: JSON.stringify({question})});
      if (!r.ok) throw new Error('The service answered ' + r.status + '. Try again in a moment.');
      const data = await r.json();
      reply.className = 'msg bot';
      reply.textContent = data.answer || 'No answer came back.';
      if (data.sources && data.sources.length) {
        const s = document.createElement('div');
        s.className = 'sources';
        s.innerHTML = '<b>Articles used:</b> ';
        s.appendChild(document.createTextNode(data.sources.join(' · ')));
        reply.appendChild(s);
      }
    } catch (e) {
      reply.className = 'msg bot error';
      reply.textContent = e.message || 'The question could not be sent.';
    } finally {
      send.disabled = false;
      main.scrollTop = main.scrollHeight;
    }
  }

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const text = q.value.trim();
    if (!text || send.disabled) return;
    q.value = '';
    ask(text);
  });
  q.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('form').requestSubmit(); }
  });
  document.querySelectorAll('.suggest button').forEach(b => b.addEventListener('click', () => ask(b.textContent)));
</script>
</body>
</html>
